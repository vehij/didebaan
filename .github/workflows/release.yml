name: Release macOS app

# Builds a universal (Apple Silicon + Intel) .dmg plus signed update files and publishes them on Releases.
# Start it from the Actions tab (Run workflow), or by pushing a version tag like v0.3.0.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'شماره‌ی نسخه، مثلاً 0.4.0 (خالی = همان نسخه‌ی package.json)'
        required: false
        default: ''
      notes:
        description: 'چه چیزی در این نسخه عوض شده؟ (در پیام به‌روزرسانی داخل اپ نشان داده می‌شود)'
        required: false
        default: 'بهبودها و رفع اشکال'

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the update signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is missing. Add it under Settings › Secrets and variables › Actions (see README)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set version
        id: version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          node .github/scripts/set-version.mjs "$VERSION"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Release v$VERSION"
            git push origin "HEAD:$BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          args: --target universal-apple-darwin
          tagName: v__VERSION__
          commitish: ${{ steps.version.outputs.sha || github.sha }}
          releaseName: 'دیده‌بان v__VERSION__'
          releaseDraft: false
          prerelease: false
          # Everything above the --- line is shown inside the app's update message.
          releaseBody: |
            ${{ inputs.notes || 'بهبودها و رفع اشکال' }}

            ---

            ## نصب

            اگر دیده‌بان را از قبل نصب کرده‌ای، لازم نیست چیزی دانلود کنی: خود اپ خبرت می‌کند و با یک دکمه به‌روز می‌شود.

            برای نصب اول:
            1. فایل `.dmg` را از بخش **Assets** پایین همین صفحه دانلود کن.
            2. بازش کن و آیکون **Didebaan** را روی پوشه‌ی **Applications** بکش.
            3. اپ را از Applications باز کن. اگر مک گفت نمی‌تواند سازنده را تأیید کند، **Done** را بزن، بعد به
               **System Settings › Privacy & Security** برو و پایین صفحه کنار پیام Didebaan روی **Open Anyway** بزن.
            4. اگر به‌جایش گفت «Didebaan is damaged and can't be opened»، راهنمای «اگر اپ باز نشد» در
               [README](https://github.com/vehij/didebaan#اگر-اپ-باز-نشد) را ببین؛ با یک دستور کوتاه درست می‌شود.
